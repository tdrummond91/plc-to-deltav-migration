<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1080" class="atlas-svg" role="img" aria-labelledby="parser-title parser-desc"><title id="parser-title">Proposed Operate to Live parsing and transformation route</title><desc id="parser-desc">Color-coded relationship map. Named containers show organization. Arrow labels describe creation, containment, references or calls. Select a card in the HTML atlas for its explanation and parser implications.</desc><style>
svg{background:#0b0f15;font-family:Segoe UI,Arial,sans-serif;color:#edf2f5}.zone{fill:#10151d;stroke:#303b48;stroke-width:1}.zone-title{fill:#edf2f5;font-size:21px;font-weight:650}.zone-sub{fill:#aab6c5;font-size:14px}.card rect{fill:#13202a;stroke:#526171;stroke-width:1}.card .stripe{stroke:#8ba3b9;stroke-width:3}.card.teal rect{fill:#102824;stroke:#39736a}.card.teal .stripe{stroke:#4ce5d5}.card.purple rect{fill:#241e32;stroke:#67577e}.card.purple .stripe{stroke:#cab1f1}.card.pink rect{fill:#2a1b29;stroke:#805168}.card.pink .stripe{stroke:#ff6bbd}.card.orange rect{fill:#2a2017;stroke:#865d3c}.card.orange .stripe{stroke:#ffad70}.card-title{fill:#f0f3f6;font-size:18px;font-weight:650}.card-copy{fill:#b8c3cf;font-size:15px}.edge{fill:none;stroke:#8797a7;stroke-width:1.7;stroke-linejoin:round}.edge.ref{stroke:#d28abc;stroke-dasharray:6 5}.edge.create{stroke:#bea3e2;stroke-dasharray:2 5}.edge-label rect{fill:#0b0f15;stroke:#384553}.edge-label text{fill:#d3dce5;font-size:12px}.small-note{fill:#aab6c5;font-size:14px}.card{cursor:pointer}.card:focus{outline:none}.card:focus rect,.card:hover rect{stroke:#edf2f5;stroke-width:2}.card.selected rect{stroke:#fff;stroke-width:2.5}.dim{opacity:.22}.lane-title{fill:#ffad70;font-size:13px;font-weight:700;letter-spacing:1.5px}
</style><defs><marker id="parser-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a6b5c3" stroke-width="1.6"/></marker></defs><rect class="zone" x="30" y="30" width="1220" height="100" rx="18"/><text class="zone-title" x="55" y="67">A parser should preserve a graph of relationships</text><text class="zone-sub" x="55" y="91">Proposed architecture · use the documented export as evidence; verify target output in the installed DeltaV release.</text><g class="card slate" data-node="parse-input" data-family="slate" tabindex="0" role="button" aria-label="01 · Operate evidence"><title>Use the source graphics, placed pictures and their script/form/shared dependencies as evidence. The export result is a valuable structured starting point; no raw .grf/.fds binary schema is established here.</title><rect x="60" y="210" width="340" height="155" rx="12"/><path class="stripe" d="M61 229v117"/><text class="card-title" x="79" y="241">01 · Operate evidence</text><text class="card-copy"><tspan x="79" y="268">Pictures + dynamo source sets</tspan><tspan x="79" y="290">VBA / forms / shared dependencies</tspan><tspan x="79" y="312">Paths, versions and assets</tspan><tspan x="79" y="334">Keep originals as provenance</tspan></text></g><g class="card orange" data-node="parse-export" data-family="orange" tabindex="0" role="button" aria-label="02 · Documented export"><title>The documented Operate exporter produces converted .ahc items, per-display XML, scripting and image folders, bitmaps, summaries and logs. This gives a starting point for inspection and comparison before a custom parser or transformer is designed.</title><rect x="470" y="210" width="340" height="155" rx="12"/><path class="stripe" d="M471 229v117"/><text class="card-title" x="489" y="241">02 · Documented export</text><text class="card-copy"><tspan x="489" y="268">Export to DeltaV Live utility</tspan><tspan x="489" y="290">Per-display XML + script/image files</tspan><tspan x="489" y="312">Converted .ahc + summaries / logs</tspan><tspan x="489" y="334">Some behavior remains unsupported</tspan></text></g><g class="card teal" data-node="parse-graph" data-family="teal" tabindex="0" role="button" aria-label="03 · Neutral dependency graph"><title>An intermediate representation can preserve documents, objects, properties, bindings, handlers and assets, plus typed relationships and provenance. This is a proposed model, not Emerson’s .ahc schema.</title><rect x="880" y="210" width="340" height="155" rx="12"/><path class="stripe" d="M881 229v117"/><text class="card-title" x="899" y="241">03 · Neutral dependency graph</text><text class="card-copy"><tspan x="899" y="268">Documents → objects → properties</tspan><tspan x="899" y="290">Bindings, actions and code references</tspan><tspan x="899" y="312">Typed edges + raw values + provenance</tspan><tspan x="899" y="334">Preserve unresolved dynamic cases</tspan></text></g><path class="edge " d="M400 287H470" marker-end="url(#parser-arrow)"/><g class="edge-label"><rect x="396.0" y="173" width="78" height="27" rx="13"/><text x="435" y="191" text-anchor="middle">extract</text></g><path class="edge " d="M810 287H880" marker-end="url(#parser-arrow)"/><g class="edge-label"><rect x="797.5" y="173" width="95" height="27" rx="13"/><text x="845" y="191" text-anchor="middle">normalize</text></g><path class="edge " d="M1050 365V540H640V610" marker-end="url(#parser-arrow)"/><g class="edge-label"><rect x="740.0" y="525" width="230" height="27" rx="13"/><text x="855" y="543" text-anchor="middle">apply explicit mapping rules</text></g><g class="card pink" data-node="parse-map" data-family="pink" tabindex="0" role="button" aria-label="04 · Map / rebuild / review"><title>Separate documented converter outcomes from your target design. Custom placed dynamos convert as unlinked GEMs in the cited help; intentionally replacing them with linked classes is additional engineering. Unsupported VBA and forms require explicit disposition.</title><rect x="470" y="610" width="340" height="155" rx="12"/><path class="stripe" d="M471 629v117"/><text class="card-title" x="489" y="641">04 · Map / rebuild / review</text><text class="card-copy"><tspan x="489" y="668">Recognized objects and Experts</tspan><tspan x="489" y="690">Custom dynamo → planned GEM family</tspan><tspan x="489" y="712">Unsupported scripts / forms / controls</tspan><tspan x="489" y="734">Coverage + losses + review decisions</tspan></text></g><g class="card orange" data-node="parse-output" data-family="orange" tabindex="0" role="button" aria-label="05 · Live .ahc and dependencies"><title>Graphics Studio exports editable XML .ahc files. Use representative target-version exports as templates. Import can omit unknown elements/properties and reject invalid values; a successful import alone is not proof of equivalent behavior.</title><rect x="60" y="610" width="340" height="155" rx="12"/><path class="stripe" d="M61 629v117"/><text class="card-title" x="79" y="641">05 · Live .ahc and dependencies</text><text class="card-copy"><tspan x="79" y="668">Target-version templates / exports</tspan><tspan x="79" y="690">Import → Verify → runtime tests</tspan><tspan x="79" y="712">Compare behavior and context</tspan><tspan x="79" y="734">Publish after validation</tspan></text></g><path class="edge " d="M470 687H400" marker-end="url(#parser-arrow)"/><g class="edge-label"><rect x="391.5" y="573" width="87" height="27" rx="13"/><text x="435" y="591" text-anchor="middle">generate</text></g><rect class="zone" x="880" y="610" width="340" height="155" rx="18"/><text class="zone-title" x="905" y="647">Not a proven converter</text><text class="zone-sub" x="905" y="671">This map proposes a design.</text><text class="card-copy"><tspan x="905" y="701">No raw binary format is specified.</tspan><tspan x="905" y="725">No sample exports were parsed.</tspan></text><rect class="zone" x="30" y="850" width="1220" height="175" rx="18"/><text class="zone-title" x="55" y="887">Required edge types</text><text class="zone-sub" x="55" y="911">CONTAINS · INSTANTIATES · REFERENCES · CREATES · CALLS · OPENS · READS · WRITES</text><text class="zone-sub"><tspan x="55" y="952">Attach source file/object/property/procedure locations to each mapping. Keep literal values separate from expressions.</tspan><tspan x="55" y="978">A successful .ahc import is not proof of equivalence: unknown properties can be omitted, and custom behavior needs testing.</tspan></text></svg>