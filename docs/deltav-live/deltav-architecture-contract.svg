<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1050" class="atlas-svg" role="img" aria-labelledby="contract-title contract-desc"><title id="contract-title">From an Operate dynamo form to Live GEM properties</title><desc id="contract-desc">Color-coded relationship map. Named containers show organization. Arrow labels describe creation, containment, references or calls. Select a card in the HTML atlas for its explanation and parser implications.</desc><style>
svg{background:#0b0f15;font-family:Segoe UI,Arial,sans-serif;color:#edf2f5}.zone{fill:#10151d;stroke:#303b48;stroke-width:1}.zone-title{fill:#edf2f5;font-size:21px;font-weight:650}.zone-sub{fill:#aab6c5;font-size:14px}.card rect{fill:#13202a;stroke:#526171;stroke-width:1}.card .stripe{stroke:#8ba3b9;stroke-width:3}.card.teal rect{fill:#102824;stroke:#39736a}.card.teal .stripe{stroke:#4ce5d5}.card.purple rect{fill:#241e32;stroke:#67577e}.card.purple .stripe{stroke:#cab1f1}.card.pink rect{fill:#2a1b29;stroke:#805168}.card.pink .stripe{stroke:#ff6bbd}.card.orange rect{fill:#2a2017;stroke:#865d3c}.card.orange .stripe{stroke:#ffad70}.card-title{fill:#f0f3f6;font-size:18px;font-weight:650}.card-copy{fill:#b8c3cf;font-size:15px}.edge{fill:none;stroke:#8797a7;stroke-width:1.7;stroke-linejoin:round}.edge.ref{stroke:#d28abc;stroke-dasharray:6 5}.edge.create{stroke:#bea3e2;stroke-dasharray:2 5}.edge-label rect{fill:#0b0f15;stroke:#384553}.edge-label text{fill:#d3dce5;font-size:12px}.small-note{fill:#aab6c5;font-size:14px}.card{cursor:pointer}.card:focus{outline:none}.card:focus rect,.card:hover rect{stroke:#edf2f5;stroke-width:2}.card.selected rect{stroke:#fff;stroke-width:2.5}.dim{opacity:.22}.lane-title{fill:#ffad70;font-size:13px;font-weight:700;letter-spacing:1.5px}
</style><defs><marker id="contract-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#a6b5c3" stroke-width="1.6"/></marker></defs><rect class="zone" x="30" y="30" width="1220" height="100" rx="18"/><text class="zone-title" x="55" y="67">Configuration options → effective object behavior</text><text class="zone-sub" x="55" y="91">The central translation is a relationship between options, rules and target properties.</text><rect class="zone" x="30" y="170" width="1220" height="300" rx="18"/><text class="zone-title" x="55" y="207">Operate Configure · procedural editing</text><text class="zone-sub" x="55" y="231">A form event can change many shape properties. Preserve both the code and its resulting configuration.</text><g class="card pink" data-node="contract-form" data-family="pink" tabindex="0" role="button" aria-label="Dynamo configuration form"><title>A form exposes options, then its VBA applies those options to one or more shape properties. Reading only the controls or only the final shapes loses part of the rule.</title><rect x="60" y="270" width="340" height="135" rx="12"/><path class="stripe" d="M61 289v97"/><text class="card-title" x="79" y="301">Dynamo configuration form</text><text class="card-copy"><tspan x="79" y="328">Controls / selections / entered values</tspan><tspan x="79" y="350">Edit or Apply handler in VBA</tspan><tspan x="79" y="372">Options may affect several children</tspan></text></g><g class="card pink" data-node="op-config" data-family="pink" tabindex="0" role="button" aria-label="Configuration procedure"><title>Property dialogs, Experts and dynamo forms configure appearance and behavior. Dynamo forms may execute VBA to rewrite contained shape properties. The effect of that code is part of the migration requirement.</title><rect x="470" y="270" width="340" height="135" rx="12"/><path class="stripe" d="M471 289v97"/><text class="card-title" x="489" y="301">Configuration procedure</text><text class="card-copy"><tspan x="489" y="328">Conditional logic and assignments</tspan><tspan x="489" y="350">Builds paths; changes visual settings</tspan><tspan x="489" y="372">May call shared helpers</tspan></text></g><g class="card teal" data-node="op-tree" data-family="teal" tabindex="0" role="button" aria-label="Placed object state"><title>A picture can contain shapes, text, groups, data links, placed dynamos and supported ActiveX controls. Properties and animations may have been changed after placement or generated by a dynamo’s edit form.</title><rect x="880" y="270" width="340" height="135" rx="12"/><path class="stripe" d="M881 289v97"/><text class="card-title" x="899" y="301">Placed object state</text><text class="card-copy"><tspan x="899" y="328">Label · paths · colors · geometry</tspan><tspan x="899" y="350">Animations · actions · local edits</tspan><tspan x="899" y="372">Saved in the containing picture</tspan></text></g><path class="edge " d="M400 337H470" marker-end="url(#contract-arrow)"/><g class="edge-label"><rect x="402.5" y="233" width="65" height="27" rx="13"/><text x="435" y="251" text-anchor="middle">calls</text></g><path class="edge " d="M810 337H880" marker-end="url(#contract-arrow)"/><g class="edge-label"><rect x="803.0" y="233" width="84" height="27" rx="13"/><text x="845" y="251" text-anchor="middle">modifies</text></g><rect class="zone" x="30" y="525" width="1220" height="300" rx="18"/><text class="zone-title" x="55" y="562">Graphics Studio · typed properties and references</text><text class="zone-sub" x="55" y="586">Expose options in the Designer; bind child properties to them; configure each placed instance.</text><g class="card pink" data-node="contract-schema" data-family="pink" tabindex="0" role="button" aria-label="GEM property definition"><title>GEM Configuration Designer defines groups and typed custom properties. Information includes Title, Description and Tooltip; Value includes defaults and type-specific settings; Presence controls whether the option is shown in the instance’s configuration pane.</title><rect x="60" y="625" width="340" height="135" rx="12"/><path class="stripe" d="M61 644v97"/><text class="card-title" x="79" y="656">GEM property definition</text><text class="card-copy"><tspan x="79" y="683">Type + Information + Value</tspan><tspan x="79" y="705">Presence rule for configuration UI</tspan><tspan x="79" y="727">Defined by Configuration Designer</tspan></text></g><g class="card teal" data-node="contract-instance" data-family="teal" tabindex="0" role="button" aria-label="Placed GEM configuration"><title>One GEM instance supplies its own property values. An override changes an eligible internal element property and stops it tracking that class value until removed. Instance values and internal overrides are different concepts.</title><rect x="470" y="625" width="340" height="135" rx="12"/><path class="stripe" d="M471 644v97"/><text class="card-title" x="489" y="656">Placed GEM configuration</text><text class="card-copy"><tspan x="489" y="683">Instance values; defaults as applicable</tspan><tspan x="489" y="705">Separate internal-property overrides</tspan><tspan x="489" y="727">Linked / unlinked state matters</tspan></text></g><g class="card teal" data-node="contract-target" data-family="teal" tabindex="0" role="button" aria-label="Child bindings / actions"><title>A label, data link, scaling setting, visibility condition or interaction can reference the exposed GEM properties. A property named Parameter or Custom Writes does not implement anything until a child/action uses it.</title><rect x="880" y="625" width="340" height="135" rx="12"/><path class="stripe" d="M881 644v97"/><text class="card-title" x="899" y="656">Child bindings / actions</text><text class="card-copy"><tspan x="899" y="683">Label / data link / scale / visibility</tspan><tspan x="899" y="705">Expressions and action destinations</tspan><tspan x="899" y="727">References preserve the relationship</tspan></text></g><path class="edge " d="M400 692H470" marker-end="url(#contract-arrow)"/><g class="edge-label"><rect x="394.0" y="588" width="82" height="27" rx="13"/><text x="435" y="606" text-anchor="middle">exposes</text></g><path class="edge ref" d="M880 692H810" marker-end="url(#contract-arrow)"/><g class="edge-label"><rect x="795.0" y="588" width="100" height="27" rx="13"/><text x="845" y="606" text-anchor="middle">references</text></g><path class="edge create" d="M230 405V495H45V602H230V625" marker-end="url(#contract-arrow)"/><g class="edge-label"><rect x="152.5" y="480" width="155" height="27" rx="13"/><text x="230" y="498" text-anchor="middle">redesign options</text></g><path class="edge create" d="M1050 405V625" marker-end="url(#contract-arrow)"/><g class="edge-label"><rect x="975.0" y="480" width="150" height="27" rx="13"/><text x="1050" y="498" text-anchor="middle">preserve effects</text></g><rect class="zone" x="30" y="880" width="1220" height="125" rx="18"/><text class="zone-title" x="55" y="917">Three different concepts to keep separate</text><text class="zone-sub" x="55" y="941">Presence: whether an option appears in the GEM configuration pane. Visibility: whether a graphic is visible at runtime.</text><text class="zone-sub" x="55" y="975">Present Online: whether a group / GEM is included in runtime at all. A parser should not collapse these into one Boolean.</text></svg>